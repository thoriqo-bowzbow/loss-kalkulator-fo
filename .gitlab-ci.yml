# GitLab CI — pipeline sama dengan GitHub Actions:
# install → unit test (web & CLI) → typecheck + build.

image: node:22

stages:
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test
    - npm run build
